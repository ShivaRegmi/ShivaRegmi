name: Generate Stats Cards

on:
  schedule:
    - cron: "0 */6 * * *"   # refreshes every 6 hours
  workflow_dispatch:          # lets you trigger it manually
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch stats card
        run: curl -s "https://github-readme-stats.vercel.app/api?username=ShivaRegmi&show_icons=true&theme=github_dark_dimmed&hide_border=true&count_private=true" -o assets/stats.svg

      - name: Fetch streak card
        run: curl -s "https://github-readme-streak-stats.herokuapp.com/?user=ShivaRegmi&theme=github-dark-blue&hide_border=true" -o assets/streak.svg

      - name: Fetch top languages card
        run: curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=ShivaRegmi&layout=compact&theme=github_dark_dimmed&hide_border=true" -o assets/top-langs.svg

      - name: Fetch activity graph
        run: curl -s "https://github-readme-activity-graph.vercel.app/graph?username=ShivaRegmi&theme=github-compact&hide_border=true&color=38bdf8&line=38bdf8&point=e2e8f0" -o assets/activity-graph.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "Update stats cards [automated]"
          git push
